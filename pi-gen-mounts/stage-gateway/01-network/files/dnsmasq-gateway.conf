# dnsmasq: DHCP server + DNS forwarder for the wired devices on the Pi's
# Ethernet side only. Installed as /etc/dnsmasq.d/gateway-ethernet.conf
interface=${GATEWAY_ETH_IF}
# Bind when the interface appears, so a cable plugged in after boot still works
bind-dynamic
dhcp-range=${GATEWAY_DHCP_START},${GATEWAY_DHCP_END},${GATEWAY_DHCP_LEASE}
# Tell wired devices to use the Pi as their gateway and DNS server
dhcp-option=option:router,${GATEWAY_ETH_IP}
dhcp-option=option:dns-server,${GATEWAY_ETH_IP}
# We are the only DHCP server on this cable
dhcp-authoritative
# Log every DHCP exchange (journalctl -u dnsmasq)
log-dhcp
