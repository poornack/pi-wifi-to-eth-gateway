# Fixed DHCP addresses for wired devices, one per line:
#   dhcp-host=<mac address>,<name>,<ip address>
# Use addresses outside the pool in network-config (GATEWAY_DHCP_START..END).
# Installed as /etc/dnsmasq.d/gateway-reservations.conf; edit and rebuild, or
# edit that file on the Pi and run: sudo systemctl restart dnsmasq
#
# Example:
# dhcp-host=bc:fc:e7:20:59:87,esxi,192.168.2.5
