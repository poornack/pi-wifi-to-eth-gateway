#!/usr/sbin/nft -f
# Traffic between the home network (${GATEWAY_HOME_LAN}) and the Pi's Ethernet
# side (${GATEWAY_ETH_NET}) is routed unchanged, so wired devices keep their
# real addresses. Only traffic from the Ethernet side to anywhere else (the
# internet) has its source rewritten to the Pi's WiFi address ("masquerade"),
# because home routers refuse to forward sources outside their own LAN.
flush ruleset

table ip nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "${GATEWAY_WIFI_IF}" ip saddr ${GATEWAY_ETH_NET} ip daddr != { ${GATEWAY_HOME_LAN}, ${GATEWAY_ETH_NET} } masquerade
	}
}
